name: Build IPA

# Builds an unsigned IPA on a GitHub-hosted Mac and attaches it to the run as a downloadable artifact.
# Run it from the "Actions" tab ("Run workflow"), or just push to main.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    # Adding or editing source files does not change the app: no new build for that.
    paths-ignore:
      - "sources/**"
      - ".github/workflows/sources-index.yml"
      - ".github/scripts/**"

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The source ZIP from GitHub does not contain git submodules, so these two folders are empty.
      # Fetch them at the exact commits Ksign v1.6 uses.
      - name: Fetch Zsign and IDeviceKit
        run: |
          set -euo pipefail
          git lfs install --skip-repo || true

          fetch() {
            local dir="$1" url="$2" sha="$3"
            if [ -f "$dir/Package.swift" ]; then
              echo "$dir already present"
              return
            fi
            rm -rf "$dir"
            git init -q "$dir"
            git -C "$dir" remote add origin "$url"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            git -C "$dir" lfs pull || true
            git -C "$dir" submodule update --init --recursive --depth 1
          }

          fetch Zsign      https://github.com/khcrysalis/Zsign-Package 6ffe703df73ef9069adacdbb19d571f11a69a801
          fetch IDeviceKit https://github.com/khcrysalis/IDeviceKit    837cf1e14d4875771dd5ee1b754a4c86215c5db3

      # IDeviceKit's Package.swift makes Xcode download IDevice.xcframework.zip from the jkcoxson/idevice
      # GitHub release while it resolves packages. GitHub has been answering "504 Gateway Time-out" for that
      # one file, and then the whole build stops at "Could not resolve package dependencies".
      # So download it here instead: retries, a second route through the GitHub API, a check against the
      # checksum written in IDeviceKit/Package.swift, a cache for later runs, and then the package is pointed
      # at the local copy.
      - name: Read IDevice binary details
        id: idevice
        shell: bash
        run: |
          set -euo pipefail
          url=$(grep -oE 'https://github\.com/[^"]+\.zip' IDeviceKit/Package.swift | head -n 1 || true)
          sum=$(grep -oE 'checksum: *"[0-9a-f]{64}"' IDeviceKit/Package.swift | grep -oE '[0-9a-f]{64}' | head -n 1 || true)
          if [ -z "$url" ] || [ -z "$sum" ]; then
            echo "IDeviceKit has no remote binary target, nothing to download."
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$url"
          echo "sha256 $sum"
          {
            echo "needed=true"
            echo "url=$url"
            echo "sum=$sum"
          } >> "$GITHUB_OUTPUT"

      - name: Restore IDevice binary from cache
        id: idevice-cache
        if: steps.idevice.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: .idevice-cache
          key: idevice-xcframework-${{ steps.idevice.outputs.sum }}

      - name: Download IDevice binary
        if: steps.idevice.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.idevice.outputs.url }}
          SUM: ${{ steps.idevice.outputs.sum }}
        run: |
          set -uo pipefail
          mkdir -p .idevice-cache
          zip=".idevice-cache/IDevice.xcframework.zip"
          repo=$(echo "$URL" | sed -E 's#^https://github\.com/([^/]+/[^/]+)/releases/download/.*#\1#')
          tag=$(echo "$URL" | sed -E 's#^.*/releases/download/([^/]+)/.*#\1#')
          name=$(basename "$URL")

          good() { [ -s "$zip" ] && [ "$(shasum -a 256 "$zip" | cut -d' ' -f1)" = "$SUM" ]; }

          if good; then
            echo "Using the cached copy."
            exit 0
          fi

          for attempt in 1 2 3 4 5 6; do
            # The API route skips the github.com/.../releases/download/... address that has been timing out.
            echo "Attempt $attempt: GitHub API ($repo, $tag, $name)"
            gh release download "$tag" --repo "$repo" --pattern "$name" --output "$zip" --clobber \
              || echo "GitHub API download failed."
            good && break

            echo "Attempt $attempt: $URL"
            curl -fsSL --retry 2 --retry-all-errors --retry-delay 5 --connect-timeout 30 --max-time 600 \
              -o "$zip" "$URL" || echo "Direct download failed."
            good && break

            rm -f "$zip"
            sleep $((attempt * 20))
          done

          if good; then
            echo "Downloaded $name, sha256 matches."
          else
            rm -f "$zip"
            echo "::error::GitHub would not serve $name from $repo ($tag) after several tries (it answers 504 Gateway Time-out). Nothing is wrong with the app code; run the workflow again later."
            exit 1
          fi

      - name: Save IDevice binary to cache
        if: steps.idevice.outputs.needed == 'true' && steps.idevice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .idevice-cache
          key: idevice-xcframework-${{ steps.idevice.outputs.sum }}

      - name: Point IDeviceKit at the local binary
        if: steps.idevice.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .idevice-unzip
          mkdir .idevice-unzip
          unzip -q .idevice-cache/IDevice.xcframework.zip -d .idevice-unzip
          fw=$(find .idevice-unzip -maxdepth 3 -type d -name '*.xcframework' -not -path '*/__MACOSX/*' | head -n 1)
          if [ -z "$fw" ]; then
            echo "::error::IDevice.xcframework.zip does not contain an .xcframework folder."
            exit 1
          fi
          export FW_NAME="$(basename "$fw")"
          rm -rf "IDeviceKit/$FW_NAME"
          mv "$fw" "IDeviceKit/$FW_NAME"
          rm -rf .idevice-unzip

          perl -0pi -e 's/url:\s*"[^"]+",\s*checksum:\s*"[0-9a-f]{64}"/path: "$ENV{FW_NAME}"/' IDeviceKit/Package.swift
          grep -n -A 3 'binaryTarget' IDeviceKit/Package.swift
          if ! grep -q "path: \"$FW_NAME\"" IDeviceKit/Package.swift; then
            echo "::error::Could not point IDeviceKit/Package.swift at the local $FW_NAME."
            exit 1
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      # Resolve packages before building, with retries, so a passing network hiccup does not fail the build,
      # and so a real resolution error shows up in full (the lines after "Could not resolve package
      # dependencies:" say which package failed and why). Same derived data folder as the makefile uses.
      - name: Resolve Swift packages
        shell: bash
        run: |
          set -o pipefail
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/}"; printf '%s' "$s"; }
          for attempt in 1 2 3; do
            if xcodebuild -resolvePackageDependencies \
                 -project Ksign.xcodeproj \
                 -scheme Ksign \
                 -derivedDataPath "$TMPDIR/Ksign" 2>&1 | tee resolve.log; then
              exit 0
            fi
            echo "::warning::Swift package resolution failed (attempt $attempt of 3)."
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done

          grep -A 15 -E 'Could not resolve package dependencies|error:' resolve.log \
            | grep -vE '^--$' | awk 'NF && !seen[$0]++' > resolve-errors.txt || true
          {
            echo "## Swift package resolution failed"
            echo '```'
            head -n 60 resolve-errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          head -n 10 resolve-errors.txt | while IFS= read -r line; do
            echo "::error::$(esc "${line:0:900}")"
          done
          exit 1

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          make 2>&1 | tee build.log

      # The build log needs a GitHub sign-in to read. Annotations do not: they show on the run page and
      # in the public API (check-runs/<job id>/annotations), so build errors can be read without an account.
      # GitHub keeps at most 10 error annotations per step, hence two steps.
      - name: Show compile errors
        if: failure()
        shell: bash
        run: |
          touch build.log
          # Swift/C errors with a file and a line, e.g. /Users/runner/work/ofuq/ofuq/Ksign/X.swift:12:5: error: ...
          grep -E '^/[^:]+:[0-9]+:[0-9]+: (fatal )?error: ' build.log | sort -u > located-errors.txt || true
          # Everything else: asset catalog, strings, storyboard, linker, packages, scripts.
          # For package errors the reason is on the lines after "Could not resolve package dependencies:".
          {
            grep -E 'error:|^ld: |Undefined symbol|BUILD FAILED|The following build commands failed|^make: \*\*\*' build.log || true
            grep -A 12 'Could not resolve package dependencies' build.log || true
          } | grep -vE '^/[^:]+:[0-9]+:[0-9]+: (fatal )?error: ' | grep -vE '^--$' \
            | awk 'NF && !seen[$0]++' > other-errors.txt || true

          {
            echo "## Build errors"
            echo '```'
            head -n 60 located-errors.txt
            echo '---'
            head -n 60 other-errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/}"; printf '%s' "$s"; }
          head -n 10 located-errors.txt | while IFS= read -r line; do
            file="${line%%:*}"; rest="${line#*:}"
            ln="${rest%%:*}"; rest="${rest#*:}"
            col="${rest%%:*}"; msg="${rest#*error: }"
            echo "::error file=${file#"$GITHUB_WORKSPACE"/},line=${ln},col=${col}::$(esc "$msg")"
          done

      - name: Show other build errors
        if: failure()
        shell: bash
        run: |
          esc() { local s="$1"; s="${s//'%'/'%25'}"; s="${s//$'\r'/}"; printf '%s' "$s"; }
          # When there are no located errors, the rest of them are the useful ones.
          if [ -s located-errors.txt ]; then
            source_file=located-errors.txt; skip=10
          else
            source_file=other-errors.txt; skip=0
          fi
          tail -n +"$((skip + 1))" "$source_file" 2>/dev/null | head -n 10 | while IFS= read -r line; do
            echo "::error::$(esc "${line:0:900}")"
          done
          if [ "$source_file" = located-errors.txt ]; then
            head -n 5 other-errors.txt 2>/dev/null | while IFS= read -r line; do
              echo "::warning::$(esc "${line:0:900}")"
            done
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: packages/*.ipa
          if-no-files-found: error
          retention-days: 14
